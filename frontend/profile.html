<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | Campus Lost &amp; Found</title>
  <link rel="stylesheet" href="css/app.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .profile-container {
      max-width: 600px;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(20, 37, 31, 0.08);
      border-radius: 12px;
      padding: 2.5rem;
      margin-top: 2rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(20, 37, 31, 0.1);
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--mint), #f8f5ec);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      flex-shrink: 0;
    }

    .profile-info h1 {
      font-size: 1.75rem;
      margin: 0 0 0.5rem;
    }

    .profile-info p {
      margin: 0.25rem 0;
      color: #666;
    }

    .profile-field {
      margin-bottom: 1.5rem;
    }

    .profile-field label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
      margin-bottom: 0.5rem;
    }

    .profile-field p {
      font-size: 1.1rem;
      color: var(--ink);
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="container py-5">
    <a href="dashboard.html" class="btn btn-outline-primary" style="font-size: 0.9rem;"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Dashboard</a>

    <div class="profile-container mx-auto">
      <section id="profile"></section>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    apiRequest('/auth/profile').then(({data}) => {
      const user = data.user;
      document.querySelector('#profile').innerHTML = `
        <div class="profile-header">
          <div class="profile-avatar"><i class="bi bi-person" aria-hidden="true"></i></div>
          <div class="profile-info">
            <h1>${user.name}</h1>
            <p style="color: var(--coral);">${user.role}</p>
          </div>
        </div>

        <div class="profile-field">
          <label>Email Address</label>
          <p>${user.college_email}</p>
        </div>

        <div class="profile-field">
          <label>Student ID</label>
          <p>${user.student_id}</p>
        </div>

        <div class="profile-field">
          <label>Department</label>
          <p>${user.department}</p>
        </div>

        <div class="profile-field">
          <label>Account Status</label>
          <p>${user.is_verified ? '<i class="bi bi-check-circle" aria-hidden="true"></i> Verified' : 'Pending verification'}</p>
        </div>

        <div class="profile-field">
          <label>Member Since</label>
          <p>${new Date(user.created_at).toLocaleDateString()}</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid rgba(20, 37, 31, 0.1);">
          <a href="settings.html" class="btn btn-outline-primary">Settings</a>
          <a href="index.html" class="btn btn-secondary" onclick="if(confirm('Sign out?')) fetch('${API_BASE_URL}/auth/logout', {method:'POST', credentials:'include'}).then(() => location.href='index.html');">Sign Out</a>
        </div>
      `;
    }).catch(error => {
      document.querySelector('#profile').innerHTML = `
        <div class="empty-state">
          <p><i class="bi bi-x-circle" aria-hidden="true"></i> ${error.message}</p>
        </div>
      `;
    });
  </script>
</body>
</html>
