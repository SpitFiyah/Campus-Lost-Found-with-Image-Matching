<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Campus Lost &amp; Found</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .auth-card { max-width: 460px; margin: var(--space-6) auto 0; }
    .form-footer { text-align: center; font-size: 0.9rem; margin-top: var(--space-4); }
  </style>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <div class="card auth-card">
      <h1>Create account</h1>
      <p class="muted mt-0" style="margin-bottom: var(--space-5);">Join with your college email.</p>

      <form id="register-form">
        <div class="field">
          <label for="name">Full name</label>
          <input class="input" id="name" name="name" placeholder="Ananya Sharma" required>
        </div>

        <div class="field">
          <label for="college_email">College email</label>
          <input class="input" id="college_email" name="college_email" type="email" placeholder="you@college.edu" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="student_id">Student ID</label>
            <input class="input" id="student_id" name="student_id" placeholder="CS2026-041" required>
          </div>
          <div class="field">
            <label for="department">Department</label>
            <input class="input" id="department" name="department" placeholder="Computer Science" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" minlength="8" placeholder="At least 8 characters" required>
        </div>

        <button class="btn btn-primary btn-block" type="submit"><span data-icon="check"></span>Create account</button>

        <div id="form-message" role="alert" aria-live="polite" class="mt-4"></div>
      </form>

      <div class="form-footer">
        <a class="btn btn-outline btn-sm btn-block" href="login.html"><span data-icon="user"></span>Already have an account? Sign in</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script>bindAuthForm('register-form', '/auth/register', 'login.html');</script>
</body>
</html>
