<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse reports | Campus Lost &amp; Found</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="wide">
    <h1>Browse reports</h1>
    <p class="lead">Search items people have reported as lost or found on campus.</p>

    <form id="search-form" class="card">
      <div class="field-row">
        <div class="field mt-0">
          <label for="search">Search by item name</label>
          <input id="search" class="input" placeholder="e.g. laptop, wallet, keys" type="text">
        </div>
        <div class="field mt-0">
          <label for="type">Type</label>
          <select id="type" class="select">
            <option value="">All types</option>
            <option value="LOST">Lost</option>
            <option value="FOUND">Found</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn-primary"><span data-icon="search"></span>Search</button>
    </form>

    <section id="item-list" class="item-grid mt-6"></section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/items.js"></script>
</body>
</html>
