<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse reports | Campus Lost &amp; Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="container py-5">
    <div style="margin-bottom: 2rem;">
      <a href="index.html" class="btn btn-outline-primary" style="font-size: 0.9rem;"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Home</a>
    </div>

    <h1>Browse Reports</h1>
    <p class="lead">Find items people have reported as lost or found on campus.</p>

    <div class="search-form-container">
      <form id="search-form" class="row g-3">
        <div class="col-md-6">
          <label for="search" class="form-label">Search by item name</label>
          <input id="search" class="form-control" placeholder="e.g., laptop, wallet, keys..." type="text">
        </div>
        <div class="col-md-3">
          <label for="type" class="form-label">Filter by type</label>
          <select id="type" class="form-select">
            <option value="">All types</option>
            <option>LOST</option>
            <option>FOUND</option>
          </select>
        </div>
        <div class="col-md-3" style="display: flex; align-items: flex-end;">
          <button type="submit" class="btn btn-primary w-100">Search</button>
        </div>
      </form>
    </div>

    <section id="item-list" class="mt-4"></section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/items.js"></script>
</body>
</html>
