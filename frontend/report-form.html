<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report item | Campus Lost &amp; Found</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <a href="dashboard.html" class="btn btn-outline btn-sm"><span data-icon="back"></span>Back to dashboard</a>

    <div class="card mt-4" style="max-width: 640px;">
      <h1>Report <span id="report-type-label"></span> item</h1>
      <p class="muted" style="margin-bottom: var(--space-5);">Provide accurate details to help this report get matched correctly.</p>

      <form id="item-form" enctype="multipart/form-data">
        <input type="hidden" name="type" id="report-type">

        <div class="field">
          <label for="name">Item name</label>
          <input class="input" id="name" name="name" placeholder="e.g. Silver laptop, blue backpack" required>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <input class="input" id="category" name="category" placeholder="e.g. Electronics, Bag, Keys, Documents" required>
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea class="textarea" id="description" name="description" placeholder="Distinguishing details that help identify the item." required></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="color">Color</label>
            <input class="input" id="color" name="color" placeholder="e.g. Blue, Black, Silver">
          </div>
          <div class="field">
            <label for="location">Campus location</label>
            <select class="select" id="location" name="location" required>
              <option value="">Loading locations…</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="date">Date</label>
            <input class="input" id="date" type="date" name="date_lost_found" required>
          </div>
          <div class="field">
            <label for="time">Approximate time (optional)</label>
            <input class="input" id="time" type="time" name="time_lost_found">
          </div>
        </div>

        <div class="field">
          <label for="verification">Private verification detail (optional)</label>
          <input class="input" id="verification" name="private_verification_answer" placeholder="Only you should know this, e.g. a mark or initials inside.">
          <p class="hint">Used to confirm ownership when someone contacts you about this report.</p>
        </div>

        <div class="field">
          <label for="images">Photos</label>
          <label class="file-drop" for="images">
            <span data-icon="photo" data-icon-size="28"></span>
            <div>Click to choose one or more photos</div>
            <p class="hint">JPG, PNG, or WebP, up to 5 MB each</p>
            <div class="file-names" id="file-names"></div>
          </label>
          <input type="file" id="images" name="images" accept="image/jpeg,image/png,image/webp" multiple required class="hidden">
        </div>

        <button type="submit" class="btn btn-primary btn-block"><span data-icon="send"></span>Submit report</button>
        <div id="form-message" role="alert" aria-live="polite" class="mt-4"></div>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/report-form.js"></script>
</body>
</html>
