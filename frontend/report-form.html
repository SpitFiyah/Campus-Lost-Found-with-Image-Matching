<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report item | Campus Lost &amp; Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .form-container {
      max-width: 600px;
      background: rgba(255, 255, 255, 0.97);
      padding: 2.5rem;
      border-radius: 12px;
      border: 1px solid rgba(20, 37, 31, 0.08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      margin-top: 2rem;
    }

    .form-container h1 {
      margin-bottom: 1.5rem;
      font-size: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      font-weight: 600;
      margin-bottom: 0.75rem;
      display: block;
    }

    .form-control,
    .form-select,
    textarea {
      padding: 0.75rem 1rem;
      border: 2px solid rgba(20, 37, 31, 0.08);
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 1rem;
    }

    .form-control:focus,
    .form-select:focus,
    textarea:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(20, 37, 31, 0.1);
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .file-input-wrapper {
      position: relative;
    }

    .file-input-label {
      display: block;
      padding: 2rem;
      background: rgba(244, 124, 98, 0.05);
      border: 2px dashed rgba(244, 124, 98, 0.3);
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .file-input-label:hover {
      border-color: var(--coral);
      background: rgba(244, 124, 98, 0.1);
    }

    .file-input-wrapper input {
      display: none;
    }

    .file-name {
      color: var(--coral);
      font-weight: 600;
      margin-top: 0.5rem;
    }

    .btn-submit {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: 600;
      margin-top: 1.5rem;
    }

    #form-message {
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <main class="container py-5">
    <a href="dashboard.html" class="btn btn-outline-primary" style="font-size: 0.9rem;"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Dashboard</a>

    <div class="form-container mx-auto">
      <h1>Report <span id="report-type-label" style="color: var(--coral);"></span> Item</h1>
      <p class="lead" style="font-size: 0.95rem; color: #666; margin-bottom: 2rem;">Provide details about the item you want to report.</p>

      <form id="item-form" enctype="multipart/form-data">
        <input type="hidden" name="type" id="report-type">

        <div class="form-group">
          <label class="form-label" for="name">Item Name *</label>
          <input class="form-control" id="name" name="name" placeholder="e.g., Silver Laptop, Blue Backpack" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="category">Category *</label>
          <input class="form-control" id="category" name="category" placeholder="e.g., Electronics, Bag, Keys, Documents" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="description">Description *</label>
          <textarea class="form-control" id="description" name="description" placeholder="Provide detailed description to help others identify the item..." required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="color">Color</label>
          <input class="form-control" id="color" name="color" placeholder="e.g., Blue, Black, Silver">
        </div>

        <div class="form-group">
          <label class="form-label" for="location">Campus Location *</label>
          <select class="form-select" id="location" name="location" required>
            <option value="">-- Select a location --</option>
            <option>Block A</option>
            <option>Block B</option>
            <option>Library</option>
            <option>Cafeteria</option>
            <option>Auditorium</option>
            <option>Parking</option>
            <option>Sports Ground</option>
            <option>Hostel</option>
            <option>Main Gate</option>
            <option>Laboratory</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="date">Date *</label>
          <input class="form-control" id="date" type="date" name="date_lost_found" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="verification">Private Verification Detail</label>
          <input class="form-control" id="verification" name="private_verification_answer" placeholder="e.g., Initials inside, specific mark (only you should know this)">
          <small style="color: #999; margin-top: 0.5rem; display: block;">This helps verify ownership when someone contacts you.</small>
        </div>

        <div class="form-group">
          <label class="form-label">Photo *</label>
          <div class="file-input-wrapper">
            <label class="file-input-label" for="images">
              <div style="font-size: 2rem; margin-bottom: 0.5rem;"><i class="bi bi-cloud-upload" aria-hidden="true"></i></div>
              <div>Click to upload or drag and drop</div>
              <small style="color: #999; display: block; margin-top: 0.5rem;">PNG, JPG, WebP (max 5MB)</small>
              <div class="file-name" id="file-name"></div>
            </label>
            <input type="file" id="images" name="images" accept="image/jpeg,image/png,image/webp" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-submit">Submit Report</button>

        <div id="form-message" role="alert" aria-live="polite"></div>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const type = new URLSearchParams(location.search).get('type') || 'LOST';
    document.querySelector('#report-type').value = type;
    document.querySelector('#report-type-label').textContent = type.toLowerCase();

    // Handle file input display
    document.querySelector('#images').addEventListener('change', function(e) {
      const fileName = e.target.files[0]?.name || '';
      document.querySelector('#file-name').innerHTML = fileName ? '<i class="bi bi-check-circle" aria-hidden="true"></i> ' + fileName : '';
    });

    // Handle form submission
    document.querySelector('#item-form').addEventListener('submit', async event => {
      event.preventDefault();
      try {
        await fetch(`${API_BASE_URL}/items`, {
          method: 'POST',
          credentials: 'include',
          body: new FormData(event.currentTarget)
        }).then(async response => {
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.error?.message || 'Report failed');
          return payload;
        });
        location.href = 'dashboard.html';
      } catch (error) {
        document.querySelector('#form-message').className = 'alert alert-danger mt-3';
        document.querySelector('#form-message').textContent = error.message;
      }
    });
  </script>
</body>
</html>
