<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Item details</title><link rel="stylesheet" href="css/app.css"></head><body><main class="container py-5"><a href="browse.html">Browse reports</a><section id="detail" class="mt-5"></section></main><script src="js/api.js"></script><script>const id=new URLSearchParams(location.search).get('id');apiRequest(`/items/${id}`).then(({data})=>{const item=data.item;document.querySelector('#detail').innerHTML=`<span class="badge ${item.type==='LOST'?'text-bg-danger':'text-bg-success'}">${item.type}</span><h1 class="mt-3">${item.name}</h1><p class="lead">${item.description}</p><p>${item.category} · ${item.color||'Color not specified'} · ${item.location} · ${item.date_lost_found}</p><a class="btn btn-primary" href="matches.html?id=${item.id}">View possible matches</a>`}).catch(error=>document.querySelector('#detail').textContent=error.message);</script></body></html>
