<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Users</title><link rel="stylesheet" href="../css/app.css"></head><body><main class="container py-5"><a href="dashboard.html">Admin dashboard</a><h1 class="mt-5">Users</h1><section id="list" class="mt-4"></section></main><script src="../js/api.js"></script><script>apiRequest('/admin/users').then(({data})=>document.querySelector('#list').innerHTML=data.users.map(user=>`<p>${user.name} · ${user.college_email} · ${user.role}</p>`).join('')).catch(error=>document.querySelector('#list').textContent=error.message)</script></body></html>
