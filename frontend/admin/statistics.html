<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Statistics</title><link rel="stylesheet" href="../css/app.css"></head><body><main class="container py-5"><a href="dashboard.html">Admin dashboard</a><h1 class="mt-5">Statistics</h1><section id="stats" class="stat-grid mt-4"></section></main><script src="../js/api.js"></script><script>apiRequest('/admin/statistics').then(({data})=>document.querySelector('#stats').innerHTML=Object.entries(data).filter(([key])=>key!=='hotspots').map(([key,value])=>`<div class="stat"><small>${key.replaceAll('_',' ')}</small><strong>${value}</strong></div>`).join('')).catch(error=>document.querySelector('#stats').textContent=error.message)</script></body></html>
