<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Items</title><link rel="stylesheet" href="../css/app.css"></head><body><main class="container py-5"><a href="dashboard.html">Admin dashboard</a><h1 class="mt-5">All reports</h1><section id="list" class="mt-4"></section></main><script src="../js/api.js"></script><script>apiRequest('/admin/items').then(({data})=>document.querySelector('#list').innerHTML=data.items.map(item=>`<article class="item-row"><span class="badge text-bg-secondary">${item.type}</span><strong>${item.name}</strong><span>${item.location} · ${item.status}</span></article>`).join('')).catch(error=>document.querySelector('#list').textContent=error.message)</script></body></html>
