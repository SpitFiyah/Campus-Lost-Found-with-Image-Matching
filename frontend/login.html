<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Campus Lost &amp; Found</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .auth-card { max-width: 420px; margin: var(--space-6) auto 0; }
    .form-footer { text-align: center; font-size: 0.9rem; margin-top: var(--space-4); }
  </style>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <div class="card auth-card">
      <h1>Sign in</h1>
      <p class="muted mt-0" style="margin-bottom: var(--space-5);">Welcome back to Campus Lost &amp; Found.</p>

      <form id="login-form">
        <div class="field">
          <label for="college_email">College email</label>
          <input class="input" id="college_email" name="college_email" type="email" placeholder="you@college.edu" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" minlength="8" required>
        </div>

        <button class="btn btn-primary btn-block" type="submit"><span data-icon="check"></span>Sign in</button>

        <div id="form-message" role="alert" aria-live="polite" class="mt-4"></div>
      </form>

      <div class="form-footer">
        <a class="btn btn-outline btn-sm btn-block" href="register.html"><span data-icon="plus"></span>Don't have an account? Create one</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script>bindAuthForm('login-form', '/auth/login', 'dashboard.html');</script>
</body>
</html>
