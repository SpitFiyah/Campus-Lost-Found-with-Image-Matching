<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Campus Lost &amp; Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .auth-container {
      max-width: 450px;
      background: rgba(255, 255, 255, 0.97);
      padding: 2.5rem;
      border-radius: 12px;
      border: 1px solid rgba(20, 37, 31, 0.08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      margin-top: 3rem;
    }

    .auth-container h1 {
      margin-bottom: 1.5rem;
      font-size: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      font-weight: 600;
      margin-bottom: 0.75rem;
      display: block;
    }

    .form-control:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(20, 37, 31, 0.1);
    }

    .btn-submit {
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: 600;
    }

    .form-footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.95rem;
    }

    .form-footer a {
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
    }

    .form-footer a:hover {
      color: var(--coral);
    }

    #form-message {
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <main class="container py-5">
    <a href="index.html" class="btn btn-outline-primary" style="font-size: 0.9rem;"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Home</a>

    <div class="auth-container mx-auto">
      <h1>Sign In</h1>
      <p class="lead" style="font-size: 1rem; color: #666; margin-bottom: 2rem;">Welcome back to Campus Lost &amp; Found</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="college_email">College Email</label>
          <input class="form-control" id="college_email" name="college_email" type="email" placeholder="your.email@college.edu" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" placeholder="Enter your password" minlength="8" required>
        </div>

        <button class="btn btn-primary btn-submit" type="submit">Sign In</button>

        <div id="form-message" role="alert" aria-live="polite"></div>
      </form>

      <div class="form-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>bindAuthForm('login-form', '/auth/login', 'dashboard.html');</script>
</body>
</html>
